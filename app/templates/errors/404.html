{% extends 'base.html' %}
{% block title %}404 — Page Not Found | Aditya Learning Hub{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-12 col-md-7 text-center py-5">
    <div class="mb-4" style="font-size:7rem;line-height:1;font-weight:900;background:linear-gradient(135deg,#0D9488,#06B6D4);-webkit-background-clip:text;-webkit-text-fill-color:transparent;">404</div>
    <h2 class="fw-bold text-dark mb-2">Page Not Found</h2>
    <p class="text-muted mb-4">The page you are looking for does not exist or has been moved. Please check the URL or go back to the dashboard.</p>
    <div class="d-flex gap-3 justify-content-center flex-wrap">
      <a href="{{ url_for('dashboard.index') }}" class="btn btn-teal fw-bold px-4"><i class="fa-solid fa-house me-2"></i> Go to Dashboard</a>
      <a href="javascript:history.back()" class="btn btn-light border fw-semibold px-4"><i class="fa-solid fa-arrow-left me-2"></i> Go Back</a>
    </div>
    <div class="mt-5 opacity-50">
      <i class="fa-solid fa-map-location-dot fa-4x text-teal"></i>
    </div>
  </div>
</div>
{% endblock %}
