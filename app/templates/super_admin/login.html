<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IT Super Admin Login - Aditya Learning Hub</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #0a0f1d;
            --navy-dark: #12192c;
            --teal-accent: #00b4d8;
            --teal-hover: #0096c7;
        }
        body {
            font-family: 'Inter', sans-serif;
            background: radial-gradient(circle at top right, #1a2542 0%, var(--bg-dark) 80%);
            color: #f8f9fa;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-card {
            background: rgba(18, 25, 44, 0.65);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
            width: 100%;
            max-width: 440px;
            padding: 40px;
            transition: all 0.3s ease;
        }
        .login-card:hover {
            border-color: rgba(0, 180, 216, 0.25);
            box-shadow: 0 20px 40px rgba(0, 180, 216, 0.1);
        }
        .btn-teal {
            background-color: var(--teal-accent);
            color: #ffffff;
            border: none;
            font-weight: 600;
            padding: 12px;
            border-radius: 10px;
            transition: all 0.2s ease;
        }
        .btn-teal:hover {
            background-color: var(--teal-hover);
            color: #ffffff;
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0, 180, 216, 0.3);
        }
        .form-control {
            background: rgba(10, 15, 29, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.12);
            color: #ffffff;
            border-radius: 10px;
            padding: 12px 16px;
        }
        .form-control:focus {
            background: rgba(10, 15, 29, 0.95);
            border-color: var(--teal-accent);
            box-shadow: 0 0 0 4px rgba(0, 180, 216, 0.15);
            color: #ffffff;
        }
        .brand-logo {
            font-size: 2.2rem;
            font-weight: 800;
            color: #ffffff;
            text-align: center;
            margin-bottom: 5px;
            letter-spacing: -1px;
        }
        .brand-subtitle {
            color: rgba(255, 255, 255, 0.6);
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: 600;
            text-align: center;
            margin-bottom: 30px;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="brand-logo"><i class="fa-solid fa-database text-info me-2"></i>Aditya</div>
        <div class="brand-subtitle text-info">IT Super Admin Console</div>
        
        {% if error %}
        <div class="alert alert-danger border-0 bg-danger bg-opacity-25 text-danger-light small p-3 rounded-3 mb-4 d-flex align-items-center">
            <i class="fa-solid fa-circle-exclamation me-2 fs-5"></i>
            <div>{{ error }}</div>
        </div>
        {% endif %}

        <form method="POST">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div class="mb-3">
                <label class="form-label small fw-semibold text-white-50">IT Admin Username</label>
                <div class="input-group">
                    <span class="input-group-text bg-transparent border-end-0 border-white-10 text-white-50"><i class="fa-solid fa-user-shield"></i></span>
                    <input type="text" name="username" class="form-control border-start-0 ps-0" required placeholder="e.g. superadmin">
                </div>
            </div>
            
            <div class="mb-4">
                <label class="form-label small fw-semibold text-white-50">Secure Password</label>
                <div class="input-group">
                    <span class="input-group-text bg-transparent border-end-0 border-white-10 text-white-50"><i class="fa-solid fa-key"></i></span>
                    <input type="password" name="password" class="form-control border-start-0 ps-0" required placeholder="••••••••">
                </div>
            </div>
            
            <button type="submit" class="btn btn-teal w-100"><i class="fa-solid fa-shield-halved me-2"></i> Authenticate & Enter</button>
        </form>
    </div>
</body>
</html>
